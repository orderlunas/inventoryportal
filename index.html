<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8">
    <title>Product Inventory</title>
    <link rel="icon" type="image/png" href="./lunaslogo.jpg">

    <style>
      /* ---------- BASE ---------- */
      body {
        font-family: system-ui;
        background: #f4f5f7;
        margin: 0;
      }

      /* HEADER */
      .header {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 20px 40px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
      }

      .header img {
        width: 70px;
        height: 70px;
        border-radius: 50%;
      }

      .header h2 {
        margin: 0;
        font-weight: 600;
      }

      /* CARD */
      .card {
        margin: 40px auto;
        width: 60%;
        background: #fff;
        border-radius: 14px;
        padding: 25px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, .06);
      }

      /* SEARCH BAR */
      .toolbar {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-bottom: 20px;
      }

      .search {
        width: 320px;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        outline: none;
      }

      /* ADD BUTTON */
      .addBtn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #275538;
        color: #fff;
        font-size: 22px;
        border: none;
        cursor: pointer;
      }

      /* TABLE */
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th {
        font-size: 13px;
        color: #6b7280;
        text-align: left;
        padding-bottom: 12px;
      }

      th:nth-child(1),
      td:nth-child(1) {
        text-align: left;
        width: 50%;
      }

      th:nth-child(2),
      td:nth-child(2) {
        text-align: center;
        width: 30%;
      }

      th:nth-child(3),
      td:nth-child(3) {
        width: 20%;
        text-align: center;
      }

      td {
        padding: 16px 0;
        border-top: 1px solid #f1f5f9;
      }

      tr:hover {
        background: #fafafa;
      }

      /* ICON BUTTONS */
      .iconBtn {
        width: 34px;
        height: 34px;
        border: 1px solid #275538;
        background: #f4f4f4;
        padding: 8px 8px;
        border-radius: 8px;
        cursor: pointer;
        margin-left: 5px;
      }

      .save {
        border-color: #bbf7d0;
        color: #15803d;
      }

      .cancel {
        border-color: #fecaca;
        color: #b91c1c;
      }

      /* LOADING */
      .loading {
        text-align: center;
        padding: 30px;
        color: #777;
      }

      /* TOAST */
      .toast {
        position: fixed;
        right: 30px;
        top: 20px;
        background: #000;
        color: #fff;
        padding: 14px 18px;
        border-radius: 8px;
        opacity: 0;
        transition: .3s;
      }

      /* MODAL */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .3);
        display: none;
        justify-content: center;
        align-items: center;
      }

      .popup {
        background: #fff;
        padding: 25px;
        border-radius: 12px;
        width: 300px;
      }

      .popup input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      .popup button {
        padding: 10px 14px;
        margin-right: 8px;
      }

      .counter {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      .counter button {
        width: 28px;
        height: 28px;
        border: none;
        background: #275538;
        color: white;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
      }

      .add-prd-save-btn {
        background: #275538;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
      }

      .add-prd-save-btn:hover {
        background: #000;
      }

      .add-prd-cancel-btn {
        background: white;
        color: #275538;
        border: 1px solid #275538;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
      }

      .add-prd-cancel-btn:hover {
        background: white;
      }

      .edit-product {
        width: 320px;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        outline: none;
      }
    </style>
  </head>

  <body>

    <div class="header">
      <img src="./lunaslogo.jpg">
      <h2>Product Inventory</h2>
    </div>

    <div class="card">

      <div class="toolbar">
        <input class="search" placeholder="Search products..." oninput="searchProducts(this.value)">
        <button class="addBtn" onclick="openModal()">+</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Stock</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>

      <div id="loading" class="loading">
        Loading inventory...
      </div>

    </div>

    <div id="toast" class="toast"></div>

    <!-- MODAL -->
    <div id="modal" class="modal">
      <div class="popup">
        <h3>Add Product</h3>
        <input id="newProduct" placeholder="Product" style="width: 93%;">
        <input id="newStock" type="number" placeholder="Stock" style="width: 93%;">
        <button class="add-prd-save-btn" onclick="addProduct()">Save</button>
        <button class="add-prd-cancel-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>

    <script>
      const API = "https://script.google.com/macros/s/AKfycbxQZZJrn4FOma6sougWd1PAhY_QTmi2LrpX1S9_mCx578L_a0IME3Hakd65ry9jKkL5/exec";
      let inventory = [];
      /* ---------- LOAD DATA ---------- */
      async function loadData() {
        document.getElementById("loading").style.display = "block";
        document.getElementById("tableBody").innerHTML = "";
        const res = await fetch(API + "?action=list");
        inventory = await res.json();
        render(inventory);
        document.getElementById("loading").style.display = "none";
      }
      /* ---------- RENDER ---------- */
      function render(data) {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        data.forEach(p => {
          tbody.innerHTML += `
<tr data-id="${p.id}">
<td>${p.product}</td>
<td>${p.stock}</td>
<td>
<button class="iconBtn" onclick="editRow(this)">✎</button>
<button class="iconBtn" onclick="deleteRow(${p.id})">🗑</button>
</tr>
`;
        });
      }
      /* ---------- EDIT ---------- */
      function editRow(btn) {
        const tr = btn.closest("tr");
        const id = tr.dataset.id;
        const product = tr.children[0].innerText;
        const stock = parseInt(tr.children[1].innerText);
        tr.innerHTML = `
<td><input class="edit-product" value="${product}"></td>
<td>
<div class="counter">
<button onclick="changeStock(this,-1)">-</button>
<span>${stock}</span>
<button onclick="changeStock(this,1)">+</button>
</div>
</td>
<td>
<button class="iconBtn save" onclick="saveRow(this,${id})">✔</button>
<button class="iconBtn cancel" onclick="loadData()">✖</button>
</td>`;
      }

      function changeStock(btn, val) {
        const span = btn.parentElement.querySelector("span");
        span.innerText = Math.max(0, parseInt(span.innerText) + val);
      }
      /* ---------- SAVE ---------- */
      async function saveRow(btn, id) {
        const tr = btn.closest("tr");
        const product = tr.querySelector("input").value;
        const stock = tr.querySelector("span").innerText;
        await fetch(`${API}?action=update&id=${id}&product=${encodeURIComponent(product)}&stock=${stock}`);
        toast("Update successful");
        loadData();
      }
      /* ---------- DELETE ---------- */
      async function deleteRow(id) {
        await fetch(`${API}?action=delete&id=${id}`);
        toast("Delete successful");
        loadData();
      }
      /* ---------- ADD ---------- */
      function openModal() {
        modal.style.display = "flex";
      }

      function closeModal() {
        modal.style.display = "none";
      }
      async function addProduct() {
        const product = newProduct.value;
        const stock = newStock.value;
        await fetch(`${API}?action=add&product=${encodeURIComponent(product)}&stock=${stock}`);
        closeModal();
        toast("Update successful");
        loadData();
      }
      /* ---------- SEARCH ---------- */
      function searchProducts(txt) {
        const filtered = inventory.filter(p =>
          p.product.toLowerCase().includes(txt.toLowerCase())
        );
        render(filtered);
      }
      /* ---------- TOAST ---------- */
      function toast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.style.opacity = 1;
        setTimeout(() => t.style.opacity = 0, 2000);
      }
      /* INIT */
      loadData();
    </script>

  </body>

</html>
