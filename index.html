<!DOCTYPE html>

<html>

  <head>
    <meta charset="UTF-8">
    <title>Inventory</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
      body {
        margin: 0;
        font-family: Segoe UI;
        background: #f3f5f7;
      }

      .header {
        background: #e9ecef;
        padding: 18px 40px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .logo {
        width: 70px;
        height: 70px;
        border-radius: 50%;
      }

      .title {
        font-size: 28px;
        font-weight: 600;
      }

      .login {
        max-width: 320px;
        margin: 120px auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, .1);
      }

      .login input {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }

      .login button {
        margin-top: 15px;
        width: 100%;
        padding: 10px;
        border: none;
        background: #000814;
        color: white;
        border-radius: 8px;
        cursor: pointer;
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        background: white;
        border-radius: 18px;
        padding: 25px 30px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .05);
      }

      .topbar {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-bottom: 20px;
      }

      .search {
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #ddd;
        width: 260px;
      }

      .add-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #000814;
        color: white;
        border: none;
        font-size: 22px;
        cursor: pointer;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        text-align: left;
        padding: 14px 10px;
        color: #777;
        border-bottom: 1px solid #eee;
      }

      td {
        padding: 18px 10px;
        border-bottom: 1px solid #f0f0f0;
      }

      .icon-btn {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 10px;
        padding: 8px 10px;
        margin-left: 6px;
        cursor: pointer;
      }

      .counter {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .counter button {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background: white;
      }

      .counter input {
        width: 50px;
        text-align: center;
        border: none;
        font-size: 18px;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .35);
        display: none;
        justify-content: center;
        align-items: center;
      }

      .modal-box {
        background: white;
        padding: 25px;
        border-radius: 14px;
        width: 320px;
      }

      .toast {
        position: fixed;
        top: 25px;
        right: 25px;
        background: #28a745;
        color: white;
        padding: 14px 22px;
        border-radius: 10px;
        display: none;
      }

      #loader {
        text-align: center;
        padding: 20px;
        color: #888;
      }
    </style>

  </head>

  <body>

    <div class="header">
      <img src="./lunaslogo.jpg" class="logo">
      <div class="title">Inventory</div>
    </div>

    <div id="loginBox" class="login">
      <h3>Admin Login</h3>
      <input id="user" placeholder="User" style="width: 90%;">
      <input id="pass" type="password" placeholder="Password" style="width: 90%;">
      <button type="button" onclick="login()" style="width: 97%;">Login</button>
    </div>

    <div id="app" style="display:none">

      <div class="container">

        <div class="topbar">
          <input class="search" placeholder="Search products..." onkeyup="search(this.value)">
          <button class="add-btn" onclick="openAdd()">+</button>
        </div>

        <div id="loader">Loading inventory...</div>

        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>Stock</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>

      </div>
    </div>

    <div class="modal" id="modal">
      <div class="modal-box">
        <h3>Add Product</h3>
        <input id="newProduct" placeholder="Product">
        <input id="newStock" type="number" placeholder="Stock">
        <br><br>
        <button onclick="addProduct()">Save</button>
        <button onclick="closeModal()">Cancel</button>
      </div>
    </div>

    <div class="toast" id="toast">Update Successful</div>

    <script>
      const API = "https://script.google.com/macros/s/AKfycbxQZZJrn4FOma6sougWd1PAhY_QTmi2LrpX1S9_mCx578L_a0IME3Hakd65ry9jKkL5/exec";
      let USER = "";
      let PASS = "";
      let DATA = [];
      async function api(action, obj = {}) {
        const res = await fetch(API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action,
            user: USER,
            pass: PASS,
            ...obj
          })
        });
        return res.json();
      }
async function login(){

console.log("LOGIN CLICKED");

USER = document.getElementById("user").value.trim();
PASS = document.getElementById("pass").value.trim();

if(!USER || !PASS){
alert("Enter username & password");
return;
}

try{

console.log("Calling API...");

const test = await api("get");

console.log("API Response:", test);

if(!test.success){
alert("Invalid Login");
return;
}

document.getElementById("loginBox").style.display="none";
document.getElementById("app").style.display="block";

loadData();

}catch(err){
console.error(err);
alert("Cannot reach backend");
}
}
      async function loadData() {
        loader.style.display = "block";
        const res = await api("get");
        DATA = res.data;
        render(DATA);
        loader.style.display = "none";
      }

      function render(list) {
        tableBody.innerHTML = "";
        list.forEach(item => {
          tableBody.innerHTML += `
<tr>
<td contenteditable="false">${item.product}</td>
<td>${item.stock}</td>
<td>
<button class="icon-btn" onclick="editRow(this,${item.row})">
<i class="fa fa-pen"></i>
</button>
<button class="icon-btn" onclick="deleteRow(${item.row})">
<i class="fa fa-trash"></i>
</button>
</td>
</tr>`;
        });
      }

      function editRow(btn, row) {
        const tr = btn.closest("tr");
        const name = tr.children[0];
        const stockCell = tr.children[1];
        if (btn.dataset.editing) {
          api("update", {
            row,
            product: name.innerText,
            stock: stockCell.querySelector("input").value
          }).then(() => {
            toast();
            loadData();
          });
          btn.dataset.editing = "";
          btn.innerHTML = '<i class="fa fa-pen"></i>';
          return;
        }
        name.contentEditable = true;
        const val = stockCell.innerText;
        stockCell.innerHTML = `
<div class="counter">
<button onclick="this.nextElementSibling.stepDown()">-</button>
<input type="number" value="${val}">
<button onclick="this.previousElementSibling.stepUp()">+</button>
</div>`;
        btn.innerHTML = '<i class="fa fa-save"></i>';
        btn.dataset.editing = true;
      }
      async function deleteRow(row) {
        await api("delete", {
          row
        });
        toast();
        loadData();
      }

      function openAdd() {
        modal.style.display = "flex";
      }

      function closeModal() {
        modal.style.display = "none";
      }
      async function addProduct() {
        await api("add", {
          product: newProduct.value,
          stock: newStock.value
        });
        closeModal();
        toast();
        loadData();
      }

      function search(q) {
        const filtered = DATA.filter(x =>
          x.product.toLowerCase().includes(q.toLowerCase())
        );
        render(filtered);
      }

      function toast() {
        toast.style.display = "block";
        setTimeout(() => toast.style.display = "none", 2000);
      }
    </script>

  </body>

</html>
